name: Bridge checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      bridges: ${{ steps.changed.outputs.bridges }}
      node: ${{ steps.changed.outputs.node }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then BASE="$(git merge-base "$BASE" "$HEAD")"; fi
          selected="$(node scripts/select-bridges.mjs "$BASE" "$HEAD")"
          echo "bridges=$selected" >> "$GITHUB_OUTPUT"
          echo "node=$(jq -c '[.[] | select(IN("homeconnect","landroid","philips-hue","pocketbase","roborock","wled"))]' <<< "$selected")" >> "$GITHUB_OUTPUT"
  node:
    needs: select
    if: needs.select.outputs.node != '[]'
    strategy:
      fail-fast: false
      matrix:
        bridge: ${{ fromJSON(needs.select.outputs.node) }}
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: 'bridges/${{ matrix.bridge }}' }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { package_json_file: 'bridges/${{ matrix.bridge }}/package.json' }
      - uses: actions/setup-node@v7
        with:
          { node-version: 26.13.0, cache: pnpm, cache-dependency-path: 'bridges/${{ matrix.bridge }}/pnpm-lock.yaml' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm build && pnpm docs:build
      - if: matrix.bridge != 'pocketbase'
        run: pnpm test
      - if: matrix.bridge == 'pocketbase'
        run: pnpm test:coverage
      - if: matrix.bridge == 'wled'
        run: pnpm test:availability
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with: { context: 'bridges/${{ matrix.bridge }}', load: true, tags: bridge-under-test:ci }
      - name: Verify container health and version
        env:
          BRIDGE: ${{ matrix.bridge }}
        run: |
          extra=()
          if [ "$BRIDGE" = pocketbase ]; then
            extra=(-e MQTT_HOST=127.0.0.1 -e MQTT_PORT=1 -e POCKETBASE_URL=http://127.0.0.1:9 -e POCKETBASE_AUTH_COLLECTION=users -e POCKETBASE_USERNAME=ci -e POCKETBASE_PASSWORD=ci-placeholder)
          fi
          docker run -d --name bridge-ci -e PORT=3000 "${extra[@]}" -p 127.0.0.1:3000:3000 \
            -v "$PWD/config/config.example.yml:/app/config/config.yml:ro" bridge-under-test:ci
          trap 'docker rm -f bridge-ci >/dev/null' EXIT
          curl --retry 20 --retry-all-errors --retry-delay 1 --max-time 3 -fsS \
            -o "$RUNNER_TEMP/health.json" http://127.0.0.1:3000/health || { docker logs bridge-ci; exit 1; }
          if [ "$BRIDGE" != pocketbase ]; then
            node -e 'const h=require(process.env.RUNNER_TEMP+"/health.json");process.exit(h.status==="ok" && h.version===require("./package.json").version ? 0 : 1)'
          fi
  modbus:
    needs: select
    if: contains(fromJSON(needs.select.outputs.bridges), 'modbus')
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: bridges/modbus }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: 'clippy,rustfmt' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: bridges/modbus }
      - run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          cargo build --locked --release
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm, cache-dependency-path: bridges/modbus/docs/package-lock.json }
      - run: npm ci && npm run build
        working-directory: bridges/modbus/docs
  adguardhome:
    needs: select
    if: contains(fromJSON(needs.select.outputs.bridges), 'adguardhome')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag adguard-mqtt-bridge:ci bridges/adguardhome
  display:
    needs: select
    if: contains(fromJSON(needs.select.outputs.bridges), 'display')
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: bridges/display }
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with: { components: 'clippy,rustfmt' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: bridges/display }
      - run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked && cargo build --locked --release
      - run: docker build --tag displays-mqtt-bridge:ci .
      - uses: pnpm/action-setup@v6
        with: { package_json_file: bridges/display/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: 26.13.0, cache: pnpm, cache-dependency-path: bridges/display/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile && pnpm docs:build
  ping:
    needs: select
    if: contains(fromJSON(needs.select.outputs.bridges), 'ping')
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: bridges/ping }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mosquitto
      - run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked && cargo test --locked --test mqtt_broker -- --ignored
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: 24, cache: npm, cache-dependency-path: bridges/ping/docs/package-lock.json }
      - run: npm ci && npm run build
        working-directory: bridges/ping/docs
  ping-container:
    needs: select
    if: contains(fromJSON(needs.select.outputs.bridges), 'ping')
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    defaults:
      run: { working-directory: bridges/ping }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose config --quiet && docker build --platform "linux/${{ matrix.arch }}" -t ping-mqtt-bridge:ci . && bash tests/container-smoke.sh ping-mqtt-bridge:ci
  bridge-checks:
    needs: [select, node, modbus, display, adguardhome, ping, ping-container]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '.select.result == "success" and all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS"
